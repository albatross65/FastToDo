name: Build Docker Images

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: docker build -t fasttodo-backend ./api

      - name: Build Frontend Docker Image
        run: docker build -t fasttodo-frontend ./client
